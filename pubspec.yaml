name: infinite_image_gallery_pixabay
description: "Infinite Image Gallery App (Pixabay API) — Clean Architecture + flutter_bloc."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State management / architecture ---
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.2.0

  # --- Networking ---
  dio: ^5.9.0

  # --- Env / secure config ---
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0

  # --- Local persistence ---
  shared_preferences: ^2.5.6

  # --- Images / UI ---
  cached_network_image: ^4.0.4
  infinite_scroll_pagination: ^5.1.0
  custom_masonry_grid: ^1.0.4
  google_fonts: ^6.3.2
  shimmer: ^3.0.0

  # --- Device capabilities ---
  image_gallery_saver_plus: ^5.1.1
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  path_provider: ^2.1.5
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
